<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="main-body">
    <header class="site-header">
        <h1 id="title">Cat's Gallery</h1>
        <nav class="menu">
            <button><a href="../index.html">Home</a></button>
            <button><a href="contact.html">Contacts</a></button>
            <button><a href="gallery.html">Gallery</a></button>
            <button><a href="../../index.html">Ukrainian</a></button>
        </nav>
        <hr>
    </header>

    <main>
        <div class="gallery">
            <img src="../../photo/cat1.jpg" alt="Ecio is sleeping" width="250">
            <img src="../../photo/cat2.jpg" alt="Ecio is drinking water" width="250">
            <img src="../../photo/cat3.jpg" alt="Ecio chewing cigarette" width="250">
            <img src="../../photo/cat4.jpg" alt="Ecio sticking tongue out" width="250">
            <img src="../../photo/cat5.jpg" alt="Ecio killer mode" width="250">
        </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <footer class="site-footer">
        <hr>
        <p>&copy; 2025 Website about Ecio the cat 🐾</p>
    </footer>

    <script>
        const modal = document.getElementById("modal");
        const modalImg = document.getElementById("modal-img");
        const close = document.querySelector(".close");

        document.querySelectorAll(".gallery img").forEach(img => {
            img.addEventListener("click", () => {
                modal.style.display = "flex";
                modalImg.src = img.src;
            });
        });

        close.onclick = () => modal.style.display = "none";
        modal.onclick = e => { if (e.target === modal) modal.style.display = "none"; };
    </script>
</body>
</html>
